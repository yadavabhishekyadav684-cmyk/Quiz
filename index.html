<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript MCQ Questions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
        <h1>JS Interview Questions MCQ</h1>
        <hr style="border: 2px solid black ">
        <form id="quizForm">
            <div class="question">
                <p>1.What does "typeof null" returns ?</p>
                <label>
                    <input type="radio" name="q1" value="null"> null
                </label><br>
                <label>
                    <input type="radio" name="q1" value="object"> object
                </label><br>
                <label>
                    <input type="radio" name="q1" value="undefined"> undefined
                </label><br>
                <label>
                    <input type="radio" name="q1" value="number"> number
                </label><br>
            </div>
            <div class="question">
                <p>2.Which keywords are block-scoped?</p>
                <label>
                    <input type="radio" name="q2" value="var"> var
                </label><br>
                <label>
                    <input type="radio" name="q2" value="let and const"> let and const
                </label><br>
                <label>
                    <input type="radio" name="q2" value="only var"> only var
                </label><br>
                <label>
                    <input type="radio" name="q2" value="none"> none
                </label><br>
            </div>
            <div class="question">
                <p>3.What is the output of console.log("5" == 5, "5" === 5)?</p>
                <label>
                    <input type="radio" name="q3" value="true true"> true true
                </label><br>
                <label>
                    <input type="radio" name="q3" value="false false"> false false
                </label><br>
                <label>
                    <input type="radio" name="q3" value="true false"> true false
                </label><br>
                <label>
                    <input type="radio" name="q3" value="false true"> false true
                </label><br>
            </div>
            <div class="question">
                <p>4.console.log(a); var a = 5;?</p>
                <label>
                    <input type="radio" name="q4" value="5"> 5
                </label><br>
                <label>
                    <input type="radio" name="q4" value="ReferenceError"> ReferenceError
                </label><br>
                <label>
                    <input type="radio" name="q4" value="undefined"> undefined
                </label><br>
                <label>
                    <input type="radio" name="q4" value="null"> null
                </label><br>
            </div>
            <div class="question">
                <p>5.What is the output of console.log(0.1 + 0.2 === 0.3)?</p>
                <label>
                    <input type="radio" name="q5" value="true"> true
                </label><br>
                <label>
                    <input type="radio" name="q5" value="false"> false
                </label><br>
                <label>
                    <input type="radio" name="q5" value="error"> error
                </label><br>
                <label>
                    <input type="radio" name="q5" value="undefine"> undefine
                </label><br>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>
        <div class="result" id="result"></div>
        <div id="out"></div>
    </div>
    
</body>
<script src="first.js"></script>
</html>
